# Only non-default settings. All options: `kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'`
# Change theme: `kitten themes` (writes current-theme.conf)
include current-theme.conf

font_family      JetBrains Mono
italic_font      JetBrains Mono Italic
bold_font        auto
bold_italic_font auto
font_size        20.0
# Nerd Font icons (powerline separators, devicons) from the symbols-only font
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

background_opacity      0.89
dim_opacity             0.75
placement_strategy      top-left
hide_window_decorations yes
