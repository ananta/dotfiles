# Rebind prefix key
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# Time window for repeating a `bind -r` key (pane resizing) without the prefix
set-option -g repeat-time 500


set -g default-terminal "tmux-256color"
# pane border
set -g pane-border-style fg='#6c7086'
set -g pane-active-border-style fg='#cba6f7'
# status right
set -g status-right '#[fg=#89dceb,bg=default]#[fg=#89dceb,bg=#89dceb]'
set -ga status-right '#[fg=#a6e3a1,bg=#89dceb]#[fg=#1e1e2e,bg=#a6e3a1] #(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",") '
set -ga status-right '#[fg=#585b70,bg=#a6e3a1]#[fg=#cdd6f4,bg=#585b70] %a %H:%M '
# message text
set -g message-style bg=default,fg='#89dceb'
set -g status-style bg=default,fg='#cba6f7'
set -g status-interval 15
# status left
set -g status-left '#[bg=#cdd6f4]#[fg=#1e1e2e]#{?client_prefix,#[bg=#f5c2e7],} 󱔎 #[bg=default]#[fg=#cdd6f4]#{?client_prefix,#[fg=#f5c2e7],}'
# are we zoomed into a pane?
set -ga status-left '#[bg=default]#[fg=#f5c2e7]#{?window_zoomed_flag, ↕  ,   }'
# window status
set-window-option -g window-status-style fg='#cba6f7',bg=default
set-window-option -g window-status-current-style fg='#f5c2e7',bg=default
set -g window-status-current-format "#[fg=#cba6f7]#[bg=default]#[fg=#1e1e2e]#[bg=#cba6f7]  #I #W #[fg=#cba6f7]#[bg=default]"
set -g window-status-format "#[fg=#cdd6f4]#[bg=default]#I #W  "

# Config for moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Refresh tmux config upon r
bind-key r source-file ~/.tmux.conf

# Mouse mode keys
bind m set -g mouse on 
bind M set -g mouse off

set-option -sg escape-time 10
# Let Neovim know when the pane gains/loses focus (needed for 'autoread')
set-option -g focus-events on

# Copy Mode
set-window-option -g mode-keys vi

# Resize the current pane with prefix + H/J/K/L (repeatable). Not Ctrl-h/j/k/l:
# those belong to the programs inside (Neovim completion/Telescope, fish Ctrl-l)
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Use fish by default. (No default-command: it wraps every pane in `sh -c`,
# which hides the running program from tmux-resurrect.)
set-option -g default-shell "/opt/homebrew/bin/fish"

# Forward extended key sequences (like Shift+Enter) to Claude Code
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Persist sessions across tmux restarts and reboots.
# prefix + Ctrl-s saves, prefix + Ctrl-r restores. Continuum also saves every
# 15 minutes in the background; restoring is always manual.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Bring Claude Code panes back with their last conversation. No leading `~`:
# that matches anywhere, so `nvim /tmp/claude-…/file` would match too.
set -g @resurrect-processes '"claude->claude --continue"'

# Keep at the very bottom (continuum hooks into status-right)
run '~/.tmux/plugins/tpm/tpm'
